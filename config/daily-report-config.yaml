# ============================================
# 日報自動生成 設定ファイル
# ============================================
# このファイルを一度設定すれば、毎回の日報生成で自動適用されます
# 月初やKPI変更時のみ更新してください

# --------------------------------------------
# 基本情報
# --------------------------------------------
profile:
  name: "（氏名）"
  role: "IS（インサイドセールス）"
  team: "EmmaToolsチーム"
  report_to: "（提出先・上長名）"

# --------------------------------------------
# 月間KPI（■担当KPIと進捗 の元データ）
# --------------------------------------------
# target: 月間目標値
# unit  : 単位
# source: 実績の取得元（日報入力 or 手動更新）
kpi:
  month: "2026-09"          # 対象月（月初に更新）
  business_days: 22         # 当月の営業日数（進捗ペース計算用。祝日は未考慮）
  items:
    - name: "架電数"
      target: 1000
      unit: "件"
    - name: "アポ件数"
      target: 20
      unit: "件"
    # 必要に応じて追加
    # - name: "有効会話数"
    #   target: 300
    #   unit: "件"

# --------------------------------------------
# 業務領域カテゴリ（■週次稼働割合 の集計軸）
# --------------------------------------------
# 日報のタスクは必ずこのいずれかに分類されます
# keywords: タスク名からの自動分類に使うヒント
work_categories:
  - name: "架電業務"
    keywords: ["架電", "コール", "TEL", "アプローチ", "追客"]
  - name: "リード分析・トーク改善"
    keywords: ["トーク", "スクリプト", "リード", "振り返り"]
  - name: "施策企画・運営"
    keywords: ["施策", "コミュニティ", "イベント", "台本", "アジェンダ", "企画", "スケジュール", "運営"]
  - name: "クライアント対応"
    keywords: ["クライアント", "顧客", "商談", "定例", "打ち合わせ", "提案"]
  - name: "分析・レポーティング"
    keywords: ["分析", "レポート", "スライド", "資料作成", "集計", "KW", "キーワード", "チェック", "SERanking", "順位"]
  - name: "プロダクト・リリース対応"
    keywords: ["リリース", "新機能", "EmmaQuick", "EmmaLLMO", "AIO", "フルスタ", "不具合", "プロダクト"]
  - name: "仕組み化・自動化"
    keywords: ["自動化", "仕組み", "ツール", "整備", "テンプレ", "マニュアル"]
  - name: "MTG・社内連携"
    keywords: ["MTG", "夕礼", "朝礼", "共有会", "面談", "引き継ぎ"]
  - name: "事務・その他"
    keywords: ["請求書", "メール", "経費", "庶務", "対応"]

# 分類の優先順位（keywords が複数一致した場合、上の行を優先する）
# 例：クライアント分析・記事分析 → 分析・レポーティング（クライアント対応ではない）
category_priority:
  - "架電業務"
  - "施策企画・運営"
  - "分析・レポーティング"
  - "プロダクト・リリース対応"
  - "仕組み化・自動化"
  - "クライアント対応"
  - "MTG・社内連携"
  - "リード分析・トーク改善"
  - "事務・その他"

# 目安とする稼働割合（乖離があれば所感・課題で触れる）
# ※実際の担当業務の構成に合わせて要更新。未設定のカテゴリは乖離判定の対象外
target_ratio:
  # 架電業務: 50
  # リード分析・トーク改善: 15
  # 施策企画・運営: 0
  # クライアント対応: 0
  # 分析・レポーティング: 0
  # 仕組み化・自動化: 15
  # MTG・社内連携: 10
  # 事務・その他: 10

# --------------------------------------------
# 文体ルール（config/brand-rules.yaml と揃える）
# --------------------------------------------
tone:
  style: "ですます"
  manner: "丁寧・簡潔"
  person: "一人称は省略（〜と感じました／〜と考えます）"

prohibited:
  expressions:
    - "投げかけ・問いかけ（〜ではないでしょうか？など）"
    - "「」（カギ括弧）の使用"
    - "頑張ります／精進します などの精神論のみの締め"
    - "特にありません（課題欄の空欄埋め）"
  patterns:
    - "タスクの言い換えだけで終わる所感"
    - "根拠のない一般論・教科書的な正論"

# --------------------------------------------
# 出力するセクション
# --------------------------------------------
# 日報に含めるセクションを true / false で切り替えます
sections:
  kpi_progress: false       # ■担当KPIと進捗（月間）
  weekly_ratio: true        # ■週次の稼働割合
  work_log: true            # ■本日の業務実績
  insight: true             # ■所感
  issue: true               # ■課題・相談事項
  next_day: true            # ■次の営業日のタスク

# --------------------------------------------
# 週次の稼働割合
# --------------------------------------------
weekly_ratio:
  week_start: "火"          # 週の起点となる曜日
  unit: "hours"             # hours（時間のみ）/ percent（%も併記）
  format: "・グループ名（X.Xh）"
  sort: "desc"              # 時間の多い順
  show_total: false

# 週次の集計に使うグループ（大まかな束ね方）
# 台帳のタスクをこのグループのいずれかに寄せて合算します
weekly_groups:
  - name: "社内MTG"
    includes: ["社内MTG", "夕礼", "朝礼", "共有会", "定例"]
  - name: "クライアントMTG"
    includes: ["クライアントMTG", "社外MTG", "MTG準備", "MTG前準備"]
  - name: "クライアントタスク"
    includes: ["競合洗い出し", "サイト分析", "KWチェック", "記事分析", "スライド作成", "レポート"]
  - name: "EmmaQuickリリース業務"
    includes: ["EmmaQuick", "フルスタ", "リリース", "Notion作成"]
  - name: "EmmaTools関連業務"
    includes: ["EmmaTools", "EmmaLLMO", "機能紹介ページ", "機能ページ", "AIO"]
  - name: "施策・イベント"
    includes: ["座談会", "コミュニティ", "イベント", "アンケート", "メルマガ"]
  - name: "解約対応"
    includes: ["解約"]
  - name: "メール対応・事務"
    includes: ["メール", "請求書", "経費", "アカウント発行", "HubSpot", "事務"]

# --------------------------------------------
# 業務実績の書式
# --------------------------------------------
work_log:
  heading: "■本日の業務実績"
  format: "・タスク名（X.Xh）"
  show_output: false        # true にするとタスクごとにアウトプットを併記
  show_total: false         # true にすると末尾に ※合計X.Xh を付ける

# --------------------------------------------
# 所感の生成方針
# --------------------------------------------
insight:
  length: "150〜250字"
  focus_count: 1            # 所感で深掘りするテーマ数（1つに絞る）
  structure:                # この順序で組み立てる
    - "事実：何を見て何に気づいたか"
    - "解釈：そこから何が言えるか（分類・仮説）"
    - "打ち手：明日以降どう動くか（具体的な相手・行動）"
  require_next_action: true # 打ち手のない所感は出力しない

# --------------------------------------------
# 課題・相談事項の方針
# --------------------------------------------
issue:
  free_form: true           # 定型の2行構成に縛らず、その日に伝えるべき内容を書く
  ask_to_someone: true      # 相談する場合は依頼先を明記する
  allow_notice_only: true   # 休暇連絡など、連絡事項のみでもよい
  allow_none: true          # 本当に何もない日は 特になし と書く（無理に作らない）

# --------------------------------------------
# 次営業日タスクの方針
# --------------------------------------------
next_day:
  include: true
  total_hours: 8.0          # 1日の想定稼働時間
  format: "・タスク名（X.Xh）"

# --------------------------------------------
# 出力設定
# --------------------------------------------
output:
  dir: "output"
  filename: "daily-report-{date}.md"   # {date} は YYYY-MM-DD
  copy_ready: true                      # そのまま貼り付けられる形で出力
