# ============================================
# 日報自動生成 設定ファイル
# ============================================
# このファイルを一度設定すれば、毎回の日報生成で自動適用されます
# 月初やKPI変更時のみ更新してください

# --------------------------------------------
# 基本情報
# --------------------------------------------
profile:
  name: "（氏名）"
  role: "IS（インサイドセールス）"
  team: "EmmaToolsチーム"
  report_to: "（提出先・上長名）"

# --------------------------------------------
# 月間KPI（■担当KPIと進捗 の元データ）
# --------------------------------------------
# target: 月間目標値
# unit  : 単位
# source: 実績の取得元（日報入力 or 手動更新）
kpi:
  month: "2026-08"          # 対象月（月初に更新）
  business_days: 20         # 当月の営業日数（進捗ペース計算用）
  items:
    - name: "架電数"
      target: 1000
      unit: "件"
    - name: "アポ件数"
      target: 20
      unit: "件"
    # 必要に応じて追加
    # - name: "有効会話数"
    #   target: 300
    #   unit: "件"

# --------------------------------------------
# 業務領域カテゴリ（■週次稼働割合 の集計軸）
# --------------------------------------------
# 日報のタスクは必ずこのいずれかに分類されます
# keywords: タスク名からの自動分類に使うヒント
work_categories:
  - name: "架電業務"
    keywords: ["架電", "コール", "TEL", "アプローチ", "追客"]
  - name: "リード分析・トーク改善"
    keywords: ["トーク", "スクリプト", "リード", "振り返り"]
  - name: "施策企画・運営"
    keywords: ["施策", "コミュニティ", "イベント", "台本", "アジェンダ", "企画", "スケジュール", "運営"]
  - name: "クライアント対応"
    keywords: ["クライアント", "顧客", "商談", "定例", "打ち合わせ", "提案"]
  - name: "分析・レポーティング"
    keywords: ["分析", "レポート", "スライド", "資料作成", "集計", "KW", "キーワード", "チェック"]
  - name: "プロダクト・リリース対応"
    keywords: ["リリース", "新機能", "EmmaQuick", "AIO", "フルスタ", "不具合", "プロダクト"]
  - name: "仕組み化・自動化"
    keywords: ["自動化", "仕組み", "ツール", "整備", "テンプレ", "マニュアル"]
  - name: "MTG・社内連携"
    keywords: ["MTG", "夕礼", "朝礼", "共有会", "面談", "引き継ぎ"]
  - name: "事務・その他"
    keywords: ["請求書", "メール", "経費", "庶務", "対応"]

# 分類の優先順位（keywords が複数一致した場合、上の行を優先する）
# 例：クライアント分析・記事分析 → 分析・レポーティング（クライアント対応ではない）
category_priority:
  - "架電業務"
  - "施策企画・運営"
  - "分析・レポーティング"
  - "プロダクト・リリース対応"
  - "仕組み化・自動化"
  - "クライアント対応"
  - "MTG・社内連携"
  - "リード分析・トーク改善"
  - "事務・その他"

# 目安とする稼働割合（乖離があれば所感・課題で触れる）
# ※実際の担当業務の構成に合わせて要更新。未設定のカテゴリは乖離判定の対象外
target_ratio:
  # 架電業務: 50
  # リード分析・トーク改善: 15
  # 施策企画・運営: 0
  # クライアント対応: 0
  # 分析・レポーティング: 0
  # 仕組み化・自動化: 15
  # MTG・社内連携: 10
  # 事務・その他: 10

# --------------------------------------------
# 文体ルール（config/brand-rules.yaml と揃える）
# --------------------------------------------
tone:
  style: "ですます"
  manner: "丁寧・簡潔"
  person: "一人称は省略（〜と感じました／〜と考えます）"

prohibited:
  expressions:
    - "投げかけ・問いかけ（〜ではないでしょうか？など）"
    - "「」（カギ括弧）の使用"
    - "頑張ります／精進します などの精神論のみの締め"
    - "特にありません（課題欄の空欄埋め）"
  patterns:
    - "タスクの言い換えだけで終わる所感"
    - "根拠のない一般論・教科書的な正論"

# --------------------------------------------
# 所感の生成方針
# --------------------------------------------
insight:
  length: "200〜300字"
  focus_count: 1            # 所感で深掘りするテーマ数（1つに絞る）
  structure:                # この順序で組み立てる
    - "事実：何を見て何に気づいたか"
    - "解釈：そこから何が言えるか（分類・仮説）"
    - "打ち手：明日以降どう動くか（具体的な相手・行動）"
  require_next_action: true # 打ち手のない所感は出力しない

# --------------------------------------------
# 課題・相談事項の方針
# --------------------------------------------
issue:
  always_two_lines: true    # 課題・ボトルネック／相談事項 の2行構成
  ask_to_someone: true      # 相談事項は依頼先を必ず明記する

# --------------------------------------------
# 次営業日タスクの方針
# --------------------------------------------
next_day:
  include: true
  total_hours: 7.0          # 1日の想定稼働時間
  format: "・タスク名（Xh）：目的や進め方"

# --------------------------------------------
# 出力設定
# --------------------------------------------
output:
  dir: "output"
  filename: "daily-report-{date}.md"   # {date} は YYYY-MM-DD
  copy_ready: true                      # そのまま貼り付けられる形で出力
