# ============================================
# ブランドトーン＆ルール設定
# ============================================
# このファイルを一度設定すれば、毎回のレビューで自動適用されます

# --------------------------------------------
# 基本トーン設定
# --------------------------------------------
tone:
  style: "ですます"  # ですます / だである / 混在OK
  manner: "丁寧"     # 丁寧 / カジュアル / 専門的 / フレンドリー

# --------------------------------------------
# 想定読者
# --------------------------------------------
target_audience:
  - "これからSEOを学ぶ人"
  - "今SEO業務を行っている人"
  - "SEOリテラシーが低い人"

# --------------------------------------------
# 禁止事項
# --------------------------------------------
prohibited:
  expressions:
    - "投げかけ・問いかけ（〜ではないでしょうか？、〜と思いませんか？など）"
    - "「」（カギ括弧）の使用"
  words:
    # 以下に禁止ワードを追加
    # - "絶対"
    # - "必ず"
    # - "誰でも簡単に"
  patterns:
    - "煽り表現"
    - "過度な断定"
    - "差別表現"

# --------------------------------------------
# 推奨事項
# --------------------------------------------
recommended:
  structure:
    - "結論 → 理由 → 手順 の順で構成"
    - "具体例を入れる"
    - "注意点を明記"
    - "箇条書きを活用"
  expressions:
    - "〜です / 〜ます で統一"
    - "主語を明確に"
    - "一文は60字以内を目安"

# --------------------------------------------
# 文字の作法
# --------------------------------------------
writing_rules:
  numbers: "半角"          # 半角 / 全角
  alphabet: "半角"         # 半角 / 全角
  punctuation:
    comma: "、"            # 、/ ,
    period: "。"           # 。/ .
  symbols:
    parentheses: "（）"    # （）/ ()
    brackets: "［］"       # ［］/ []
  spacing:
    before_alphabet: false  # 英字前にスペース
    after_alphabet: false   # 英字後にスペース
  terms:
    # 用語統一リスト（表記ゆれ防止）
    # 正: 誤 の形式
    # SEO: "seo, Seo"
    # Webサイト: "WEBサイト, webサイト, ウェブサイト"

# --------------------------------------------
# SEO要件
# --------------------------------------------
seo_requirements:
  title:
    max_length: 32
    must_include_keyword: true
  h1:
    must_include_keyword: true
  headings:
    keyword_density: "自然に含める"
  meta_description:
    max_length: 120
    must_include_keyword: true
